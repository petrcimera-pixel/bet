<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení – KurzAnalytik</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="brand">⚽ KurzAnalytik</div>
            <div class="tagline">Analytika kurzových sázek</div>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="field">
                    <label for="username">Jméno</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Heslo</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%; justify-content:center; padding:11px;">Přihlásit se</button>
            </form>

            <div class="foot">KurzAnalytik © 2026</div>
        </div>
    </div>
</body>
</html>
